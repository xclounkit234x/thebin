<!DOCTYPE html>
<html lang="en-us">

<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Geometry Vibes X-Ball</title>
    <style>
             @import url('https://fonts.cdnfonts.com/css/movavi-grotesque'); 
        html,
        body {
            background-image: url("Build/Build.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: cover;
            width: 100%;
            height: 100%;
            overflow: visible;
            padding: 0;
            margin: 0;
            background-color: black;
        }

        div#gameContainer {
            background: transparent !important;
            position: absolute;
            top: 0px !important;
            width: 100% !important;
            height: 100% !important;
            left: 0px !important;
        }

        div#gameContainer canvas {
            position: absolute;
            width: 100% !important;
            height: 100% !important;
        }

        div#gameContainer canvas[data-pixel-art="true"] {
            position: absolute;
            image-rendering: optimizeSpeed;
            image-rendering: -webkit-crisp-edges;
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: optimize-contrast;
            image-rendering: pixelated;
            -ms-interpolation-mode: nearest-neighbor;
        }

        .loadingOut {
            width: 250px;
            position: fixed;
            left: 50%;
            top: calc(50% - 8px);
            transform: translate(-50%);
            border: 2px solid white;
            height: 14px;
            background: transparent;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(to right, white, white 0%, transparent 0%, transparent);
        }

        .centered {
            position: fixed;
            top: 50%;
            left: 50%;
            margin-top: -150px;
            margin-left: -250px;
            width: 500px;
        }

        #orientation-warning {
            display: none;
            position: fixed;
            top: 55%;/*Yeni Eklendi*/
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            padding: 15px;
            text-align: center;
            z-index: 1000;
            font-family: 'Movavi Grotesque', sans-serif;/*Yeni Eklendi*/
            font-size: 6vw;/*Yeni Eklendi*/
            line-height: 120%;/*Yeni Eklendi*/
        }

        #orientation-image {
            margin-top: 10px;
            display: none;
            position: fixed;
            top: calc(50% - 150px);
            left: 50%;
            transform: translate(-50%, -50%);
        }
        #orientation-bg-color {
            background-color: #250739;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            
        }
    </style>
</head>

        <script>
            var canvas = document.querySelector("#unity-canvas");
            var progressBar = document.querySelector("#progress-bar");
            var gameContainer = document.querySelector("#gameContainer");
            var orientationWarning = document.querySelector("#orientation-warning");
            var orientationImage = document.querySelector("#orientation-image");
            var orientationBG = document.querySelector("#orientation-bg-color"); //Yeni Eklendi
            var config = {
                dataUrl: "Build/geometryball_v17.data.unityweb",
                frameworkUrl: "Build/geometryball_v17.framework.js.unityweb",
                codeUrl: "Build/geometryball_v17.wasm.unityweb",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "GameVGames",
                productName: "Geometry Vibes X-Ball",
                productVersion: "1.0",
            };
            var scaleToFit;
            try {
                scaleToFit = !!JSON.parse("");
            } catch (e) {
                scaleToFit = true;
            }

            function progressHandler(progress) {
                var percent = progress * 100 + '%';
                progressBar.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent)';
            }

            function onResize() {
                var container = canvas.parentElement;
                var w;
                var h;

                if (scaleToFit) {
                    w = window.innerWidth;
                    h = window.innerHeight;

                    var r = 600 / 960;

                    if (w * r > window.innerHeight) {
                        w = Math.min(w, Math.ceil(h / r));
                    }
                    h = Math.floor(w * r);
                } else {
                    w = 960;
                    h = 600;
                }

                container.style.width = canvas.style.width = w + "px";
                container.style.height = canvas.style.height = h + "px";
                container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
                container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
            }

            function isMobile() {
                return /Mobi|Android/i.test(navigator.userAgent);
            }
           function checkOrientation(orientation) {
            if (!isMobile()) {
                    // Eğer cihaz mobil değilse, hiçbir şey yapma.
                    return;
                }
                if (orientation === "Portrait" && window.innerHeight < window.innerWidth) {
                    orientationWarning.style.display = 'block';
                    gameContainer.style.display = 'none';
                    orientationWarning.innerText = 'Please rotate your device to portrait mode.';
                    orientationImage.style.display = 'block';  // Ensure the image is visible
                } else if (orientation === "Landscape" && window.innerHeight > window.innerWidth) {
                    orientationWarning.style.display = 'block';
                    gameContainer.style.display = 'none';
                    orientationWarning.innerText = 'Please rotate your device to landscape mode.';
                    orientationImage.style.display = 'block';  // Ensure the image is visible
                } else {
                    orientationWarning.style.display = 'none';
                    gameContainer.style.display = 'block';
                    orientationImage.style.display = 'none';  // Hide the image when not needed
                }
            }

            function loadTemplateConfig() {
                if (!isMobile()) {
                    // Eğer cihaz mobil değilse, hiçbir şey yapma.
                    return;
                }
                var request = new XMLHttpRequest();
                request.open('GET', 'TemplateData/Orientation/template.json', true);
                request.onreadystatechange = function() {
                    if (request.readyState === 4 && request.status === 200) {
                        var config = JSON.parse(request.responseText);
                        var orientation = config.customOptions.find(option => option.name === "orientation").default;
                        checkOrientation(orientation);
                    }
                };
                request.send();
            }

            createUnityInstance(canvas, config, progressHandler).then(function(instance) {
                canvas = instance.Module.canvas;
                onResize();
            });

            window.addEventListener('resize', function() {
                onResize();
                loadTemplateConfig();
            });

            loadTemplateConfig();
        </script>
